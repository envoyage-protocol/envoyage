# Envoyage subgraph schema
#
# The entities below are shaped around one question a judge, an owner, or an
# integrating protocol all ask differently: what is this keeper ALLOWED to do, and
# what did it actually do? Most automation indexes only the second half, because the
# first half does not exist on chain — an ERC-721 approval records no scope. Here it
# does, so both halves are queryable and comparable.

type Mandate @entity(immutable: false) {
  "Decimal mandate id"
  id: ID!
  mandateId: BigInt!

  keeper: Keeper!
  "Owner at grant time. Set from msg.sender by the contract, so it cannot be forged."
  grantor: Bytes!
  position: Position!

  # ── the scope, i.e. the part an approval cannot express ──────────────────
  "Cap on the keeper's share, in bps of HARVESTED FEES — never of the position."
  maxFeeBps: Int!
  "Pinned at grant time and never mutable."
  feeRecipient: Bytes!
  expiry: BigInt!
  "Cooldown in seconds; closes value extraction by repeated calls."
  minInterval: BigInt!
  compoundAllowed: Boolean!

  status: MandateStatus!

  grantedAt: BigInt!
  grantedAtBlock: BigInt!
  grantedTx: Bytes!
  revokedAt: BigInt
  revokedTx: Bytes

  executions: [Execution!]! @derivedFrom(field: "mandate")
  executionCount: Int!
  lastExecutedAt: BigInt

  # ── what actually happened, in the same units as the scope ───────────────
  totalFee0ToKeeper: BigInt!
  totalFee1ToKeeper: BigInt!
  totalLiquidityAdded: BigInt!
}

enum MandateStatus {
  ACTIVE
  REVOKED
}

type Execution @entity(immutable: true) {
  id: ID!
  mandate: Mandate!
  keeper: Keeper!

  fee0ToKeeper: BigInt!
  fee1ToKeeper: BigInt!
  liquidityAdded: BigInt!

  timestamp: BigInt!
  block: BigInt!
  tx: Bytes!
  "Who paid gas. Should equal the mandate's keeper — recorded so it is checkable."
  caller: Bytes!
}

type Keeper @entity(immutable: false) {
  "Keeper address, lowercase hex"
  id: ID!
  mandateCount: Int!
  activeMandateCount: Int!
  executionCount: Int!
  totalFee0Earned: BigInt!
  totalFee1Earned: BigInt!
  totalLiquidityAdded: BigInt!
  firstSeenAt: BigInt!
  mandates: [Mandate!]! @derivedFrom(field: "keeper")
  executions: [Execution!]! @derivedFrom(field: "keeper")
}

type Position @entity(immutable: false) {
  "Uniswap v4 PositionManager tokenId, as a decimal string"
  id: ID!
  tokenId: BigInt!
  mandates: [Mandate!]! @derivedFrom(field: "position")
  mandateCount: Int!
  "Enforced on chain: a position may carry at most one live mandate."
  hasActiveMandate: Boolean!
  totalLiquidityAdded: BigInt!
}

"Single row, id = 'envoyage'. The numbers behind the pitch."
type Protocol @entity(immutable: false) {
  id: ID!
  mandateCount: Int!
  activeMandateCount: Int!
  revokedMandateCount: Int!
  executionCount: Int!
  keeperCount: Int!
  positionCount: Int!
  totalLiquidityAdded: BigInt!
  totalFee0ToKeepers: BigInt!
  totalFee1ToKeepers: BigInt!
}

# ── Permission census ─────────────────────────────────────────────────────
#
# Envoyage's argument is that an ERC-721 approval delegates authority without
# bounding it. These entities turn that argument into a measurement: they index
# the approvals granted on Uniswap v4's own PositionManager, so the scoped
# mandates above can be counted against the unscoped grants they replace.
#
# No other source can answer this. The v4 subgraphs index liquidity, not
# delegation; and nothing on chain records the SCOPE of an approval, because an
# approval has none. Only having both halves in one place makes the comparison
# possible.

"An address that has been delegated authority over someone's v4 position(s)."
type Delegate @entity(immutable: false) {
  "Operator/spender address, lowercase hex"
  id: ID!

  "Owners who granted this delegate blanket authority over ALL their positions."
  blanketGrants: Int!
  "Positions individually approved to this delegate."
  positionGrants: Int!
  "Mandates naming this address as keeper — i.e. delegation WITH a scope."
  scopedGrants: Int!

  firstSeenAt: BigInt!
  lastSeenAt: BigInt!
}

"A live ApprovalForAll: one owner handing one operator authority over every position they hold."
type BlanketApproval @entity(immutable: false) {
  "owner-operator"
  id: ID!
  owner: Bytes!
  delegate: Delegate!
  active: Boolean!
  grantedAt: BigInt!
  grantedTx: Bytes!
  revokedAt: BigInt
}

"A live single-position ERC-721 approval on the v4 PositionManager."
type PositionApproval @entity(immutable: false) {
  "tokenId"
  id: ID!
  tokenId: BigInt!
  owner: Bytes!
  delegate: Delegate!
  active: Boolean!
  "True when the approved address is the Envoyage contract, i.e. the approval is scoped."
  scoped: Boolean!
  updatedAt: BigInt!
  updatedTx: Bytes!
}

"Single row, id = 'census'. The comparison, in numbers."
type Census @entity(immutable: false) {
  id: ID!

  "ApprovalForAll grants currently live. Every position the owner holds, unbounded."
  activeBlanketApprovals: Int!
  "Single-position approvals currently live, to any address."
  activePositionApprovals: Int!
  "Of those, the ones pointing at Envoyage — delegation that carries a scope."
  activeScopedApprovals: Int!
  "Single-position approvals to something other than Envoyage."
  activeUnscopedApprovals: Int!

  distinctDelegates: Int!
  totalApprovalEvents: Int!
}
