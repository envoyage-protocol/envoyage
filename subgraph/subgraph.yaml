specVersion: 1.0.0
description: >-
  Scoped keeper permissions for Uniswap v4 positions. Indexes the scope a position
  owner granted alongside what the keeper actually did, so the two can be compared.
repository: https://github.com/envoyage-protocol/envoyage
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Envoyage
    network: sepolia
    source:
      address: "0x8466e82E02edF3F00c0387D5C3E66d407dc7259C"
      abi: Envoyage
      # Contract creation block, read from the transaction receipt rather than from
      # a broadcast artifact — the artifacts held two conflicting hashes after a
      # `forge script --resume`, and only one of them was ever mined.
      startBlock: 11644424
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/envoyage.ts
      entities:
        - Mandate
        - Execution
        - Keeper
        - Position
        - Protocol
      abis:
        - name: Envoyage
          file: ./abis/Envoyage.json
      eventHandlers:
        - event: MandateGranted(indexed uint256,indexed address,indexed uint256)
          handler: handleMandateGranted
        - event: MandateExecuted(indexed uint256,uint256,uint256,uint128)
          handler: handleMandateExecuted
        - event: MandateRevoked(indexed uint256)
          handler: handleMandateRevoked
  - kind: ethereum
    name: PositionManager
    network: sepolia
    source:
      # Uniswap v4's own PositionManager. Indexed so the scoped mandates above can be
      # counted against the unbounded approvals they replace — the comparison is the
      # product, and neither half means much alone.
      address: "0x429ba70129df741B2Ca2a85BC3A2a3328e5c09b4"
      abi: PositionManager
      # The PositionManager's own creation block, not Envoyage's. Starting at
      # Envoyage's deployment was the obvious choice and it made the census
      # meaningless: it counted 1 approval, ours, and reported 100% scoped. The
      # comparison only exists if the unscoped approvals are in it too — there are 177
      # ApprovalForAll and 545 Approval events in this contract's history.
      startBlock: 7259148
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/census.ts
      entities:
        - Delegate
        - BlanketApproval
        - PositionApproval
        - Census
      abis:
        - name: PositionManager
          file: ./abis/PositionManager.json
      eventHandlers:
        - event: ApprovalForAll(indexed address,indexed address,bool)
          handler: handleApprovalForAll
        - event: Approval(indexed address,indexed address,indexed uint256)
          handler: handleApproval
