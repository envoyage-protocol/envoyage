[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 44444444
bytecode_hash = "none"
gas_limit = "3000000000"
ffi = false
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./deployments" }]

# Mirrors v4-periphery's own compiler config. WITHOUT this block: stack-too-deep
# on the test path. See docs/SETUP-LANDMINES.md.
additional_compiler_profiles = [
  { name = "posm",       via_ir = true,  optimizer_runs = 500 },
  { name = "descriptor", via_ir = true,  optimizer_runs = 1 },
  { name = "test",       via_ir = false },
]

compilation_restrictions = [
  { paths = "lib/v4-periphery/src/PositionManager.sol", optimizer_runs = 500 },
  { paths = "lib/v4-periphery/src/hooks/permissionedPools/PermissionedPositionManager.sol", optimizer_runs = 500 },
  { paths = "lib/v4-periphery/src/PositionDescriptor.sol", optimizer_runs = 1 },
  { paths = "lib/v4-periphery/test/**", via_ir = false },
  { paths = "test/**", via_ir = false },
]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 50
fail_on_revert = false
shrink_run_limit = 5000

[profile.quick.invariant]
runs = 16
depth = 15

[profile.deep.invariant]
runs = 10000
depth = 100

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
